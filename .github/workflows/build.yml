name: Build launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - name: Restore dependencies
        run: nuget restore packages.config -PackagesDirectory ../packages -NonInteractive
      - name: Build Release
        run: msbuild KebuzLoncher.csproj /t:Rebuild /p:Configuration=Release /nologo /v:minimal
      - name: Verify single EXE package
        run: ./tools/Test-Package.ps1 -ExecutablePath ./bin/Release/KebuzLoncher.exe
      - name: Verify release publishing
        run: ./tests/ReleaseChecks.ps1 -ExecutablePath ./bin/Release/KebuzLoncher.exe
      - name: Upload launcher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: KebuzLoncher-${{ github.sha }}
          path: bin/Release/KebuzLoncher.exe
          if-no-files-found: error
          retention-days: 14
